spring:
  application:
    name: backend

  # 로컬 실행용 .env 파일(KEY=값 형식)을 설정으로 읽는다. 파일이 없으면 건너뛴다.
  # 실행 위치(작업 폴더)에 따라 찾는 경로가 달라서 두 곳을 지정한다.
  #   backend/ 에서 실행(Gradle bootRun·test 등)  → .env
  #   저장소 루트에서 실행(VS Code 기본값)         → backend/.env
  # 같은 이름의 OS 환경변수가 있으면 OS 환경변수가 우선한다.
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:backend/.env[.properties]

  # DB 접속 정보는 .env 또는 OS 환경변수로 주입한다(변수 목록: backend/.env.example).
  # 실제 값은 코드·문서에 적지 않는다.
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      # 엔티티 변경을 테이블에 자동 반영(개발용). 컬럼 삭제·타입 변경은 반영되지 않는다.
      ddl-auto: update
    # Controller 등 트랜잭션 밖에서의 지연 로딩을 막아, 요청이 끝날 때까지 DB 커넥션을 붙잡지 않게 한다.
    open-in-view: false
    properties:
      hibernate:
        # SQL 로그를 줄바꿈해 읽기 좋게 출력
        format_sql: true

  data:
    web:
      pageable:
        # API 명세 02_공통규칙: 내부 목록 page는 0부터, size 기본 20·최대 50.
        default-page-size: 20
        max-page-size: 50
        one-indexed-parameters: false

  # 추적 중 새 후보 이메일 알림(SMTP). 계정은 .env 또는 OS 환경변수 MAIL_*로 주입한다.
  # host에 기본값을 둬야 JavaMailSender 빈이 만들어진다. 계정이 없으면 앱은 시작되고 발송만 FAILED로 기록된다.
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          # SMTP 서버가 응답하지 않아도 배치가 멈추지 않도록 연결·읽기·쓰기 제한시간을 둔다(밀리초).
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000

  # JWT로만 인증하므로, Spring Security가 기본 계정(무작위 비밀번호)을 만들어 로그에 찍지 않게 한다.
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

app:
  jwt:
    # HS256 서명 키. .env 또는 OS 환경변수 JWT_SECRET으로 주입한다(만드는 법: backend/.env.example).
    # 기본값이 없으므로 설정하지 않으면 애플리케이션이 시작되지 않는다.
    secret: ${JWT_SECRET}
    # AT 30분, RT 14일(API 명세 v2 02_공통규칙 R10)
    access-token-ttl: 30m
    refresh-token-ttl: 14d

  # 경찰청·포털기관 습득물정보 조회 API(Issue #35). 키가 없으면 호출 시 오류 응답을 받을 뿐 시작은 실패하지 않는다.
  public-data:
    service-key: ${PUBLIC_DATA_SERVICE_KEY:}

  openai:
    # Key와 model은 AI 기능 호출 시 검사한다. 값이 없어도 애플리케이션은 시작할 수 있다.
    api-key: ${OPENAI_API_KEY:}
    model: ${OPENAI_MODEL:}
    timeout: ${OPENAI_TIMEOUT:10s}

# API 문서(Swagger UI: /swagger-ui.html, OpenAPI JSON: /v3/api-docs)(Issue #62)
springdoc:
  # jackson-dataformat-xml이 있어서 응답 타입에 application/xml이 함께 표시되지 않도록 JSON으로 고정한다(문서 표시만 바뀜).
  default-produces-media-type: application/json
  swagger-ui:
    # 태그·API를 Controller에 적은 순서 대신 이름순으로 보여준다.
    tags-sorter: alpha
    # 새로고침해도 Authorize에 넣은 토큰을 유지한다(브라우저 저장소에만 남는다).
    persist-authorization: true

logging:
  level:
    # 실행되는 SQL을 로그로 출력(개발용)
    org.hibernate.SQL: debug
  pattern:
    # 오류 응답에 담아 보낸 requestId로 그 요청의 로그를 찾을 수 있게, 레벨 뒤에 함께 출력한다.
    level: "%5p [%X{requestId:-}]"
