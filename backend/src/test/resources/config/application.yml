# 테스트 전용 설정. classpath:/config/application.yml은 main의 application.yml을 가리지 않고
# 같은 키만 덮어쓴다. 그래서 test(MySQL)·testSqlite(sqlite 프로필) 모두에 적용되고, CI에 비밀값을 둘 필요가 없다.
app:
  jwt:
    # 테스트에서만 쓰는 공개된 키(Base64 "where-is-it-test-only-jwt-secret", 32바이트). 실제 실행에는 쓰지 않는다.
    secret: d2hlcmUtaXMtaXQtdGVzdC1vbmx5LWp3dC1zZWNyZXQ=
