plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.16'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.whereisit'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	// REST API 서버(Spring MVC, 내장 Tomcat, JSON 변환)와 외부 API(경찰청·AI) 호출용 RestClient
	implementation 'org.springframework.boot:spring-boot-starter-web'

	// 경찰청 습득물정보 조회 API 응답(XML)을 자바 객체로 매핑(Issue #38). 버전은 Jackson BOM이 관리한다.
	implementation 'com.fasterxml.jackson.dataformat:jackson-dataformat-xml'

	// API 문서화(Swagger UI, /v3/api-docs)(Issue #62). Spring Boot BOM이 관리하지 않아서 버전을 직접 적는다.
	// 2.8.x가 Spring Boot 3.5용이고, 3.x는 Spring Boot 4용이라 쓰지 않는다.
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.17'

	// 요청 값 검증(@Valid, @NotBlank, @Email 등)
	implementation 'org.springframework.boot:spring-boot-starter-validation'

	// JPA(Hibernate)로 엔티티와 DB 테이블 매핑, Repository 기반 CRUD
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

	// 이메일 발송(JavaMailSender, SMTP) - 신규 유사 후보 알림
	implementation 'org.springframework.boot:spring-boot-starter-mail'

	// 인증·인가(SecurityFilterChain, BCrypt PasswordEncoder)
	implementation 'org.springframework.boot:spring-boot-starter-security'

	// JWT 발급·검증. Spring Boot BOM이 관리하지 않아서 버전을 직접 적는다.
	// 코드는 api만 참조하고, 구현체(impl)와 JSON 처리(jackson)는 실행할 때만 필요해서 runtimeOnly
	implementation 'io.jsonwebtoken:jjwt-api:0.13.0'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.13.0'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.13.0'

	// MySQL JDBC 드라이버 - 실행할 때만 필요해서 runtimeOnly
	runtimeOnly 'com.mysql:mysql-connector-j'

	// Getter·생성자 등 반복 코드 자동 생성 - 컴파일할 때만 필요해서 compileOnly
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'

	// 테스트 도구 모음(JUnit 5, Mockito, AssertJ, Spring Test)
	testImplementation 'org.springframework.boot:spring-boot-starter-test'

	// Security 테스트 도구(MockMvc에 보안 필터 적용, 인증 사용자 주입)
	testImplementation 'org.springframework.security:spring-security-test'

	// Gradle에서 JUnit 5 테스트를 실행하기 위한 런처
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

	// testSqlite 전용: Docker/MySQL 없이 빠르게 테스트하기 위한 SQLite JDBC 드라이버.
	// 실제 DBMS는 계속 MySQL이며, 이 드라이버는 테스트 클래스패스에만 존재한다.
	// 버전은 고정하지 않고 Spring Boot BOM(io.spring.dependency-management)에 맡긴다.
	testRuntimeOnly 'org.xerial:sqlite-jdbc'

	// SQLite용 Hibernate Dialect. 버전은 Spring Boot BOM이 관리하며, hibernate-core와 같은 버전으로 맞춰진다.
	testRuntimeOnly 'org.hibernate.orm:hibernate-community-dialects'
}

tasks.named('test') {
	useJUnitPlatform()
}

// Docker/MySQL 없이 SQLite(인메모리)로 빠르게 테스트만 실행하는 Task.
// 기본 test Task는 그대로 MySQL(.env/compose.yaml)을 사용한다.
tasks.register('testSqlite', Test) {
	group = 'verification'
	description = 'Docker/MySQL 없이 SQLite로 빠르게 테스트를 실행합니다.'
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	useJUnitPlatform()
	systemProperty 'spring.profiles.active', 'sqlite'
}

// Browser E2E 전용 Backend. test runtime classpath만 사용하므로 운영 artifact에는
// SQLite와 결정적 외부 연동 Stub이 포함되지 않는다.
tasks.register('e2eServer', JavaExec) {
	group = 'verification'
	description = 'Playwright E2E용 Spring Boot 서버를 SQLite와 결정적 Stub으로 실행합니다.'
	dependsOn testClasses
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'com.whereisit.backend.e2e.E2eBackendApplication'
	args '--spring.profiles.active=e2e', '--spring.config.location=classpath:/application-e2e.yml'
	systemProperty 'spring.datasource.url', 'jdbc:sqlite::memory:'
	systemProperty 'spring.datasource.driver-class-name', 'org.sqlite.JDBC'
	systemProperty 'spring.datasource.username', ''
	systemProperty 'spring.datasource.password', ''
}
