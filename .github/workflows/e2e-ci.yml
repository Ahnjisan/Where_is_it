name: Core Search E2E

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'backend/**'
      - 'docs/development-guide.md'
      - '.github/workflows/e2e-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'backend/**'
      - 'docs/development-guide.md'
      - '.github/workflows/e2e-ci.yml'

permissions:
  contents: read

concurrency:
  group: core-search-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-search:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Grant execute permission for Gradle wrapper
        working-directory: backend
        run: chmod +x gradlew

      - name: Start E2E backend
        working-directory: backend
        run: |
          ./gradlew e2eServer > ../backend-e2e.log 2>&1 &
          echo $! > ../backend-e2e.pid

      - name: Wait for backend
        run: |
          for attempt in {1..60}; do
            if curl --silent --fail http://127.0.0.1:8080/v3/api-docs > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          exit 1

      - name: Start frontend
        working-directory: frontend
        run: |
          npm run start -- --hostname 127.0.0.1 > ../frontend-e2e.log 2>&1 &
          echo $! > ../frontend-e2e.pid

      - name: Wait for frontend
        run: |
          for attempt in {1..60}; do
            if curl --silent --fail http://127.0.0.1:3000/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          exit 1

      - name: Run core search E2E
        working-directory: frontend
        run: npm run test:e2e -- e2e/core-search.e2e.js --project=chromium

      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: core-search-e2e-screenshots
          path: frontend/test-results/**/*.png
          if-no-files-found: ignore

      - name: Stop E2E servers
        if: always()
        run: |
          pkill -f 'next start --hostname 127.0.0.1' 2>/dev/null || true
          pkill -f 'com.whereisit.backend.e2e.E2eBackendApplication' 2>/dev/null || true
          if [ -f frontend-e2e.pid ]; then kill "$(cat frontend-e2e.pid)" 2>/dev/null || true; fi
          if [ -f backend-e2e.pid ]; then kill "$(cat backend-e2e.pid)" 2>/dev/null || true; fi
